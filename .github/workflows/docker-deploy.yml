# Pull Request Validation Workflow
#
# Purpose:
#   ✅ Validates code quality (linting, type checking)
#   ✅ Runs tests
#   ✅ Ensures Docker build works
#   ✅ Can be triggered manually for testing
#
# When it runs:
#   - Automatically on pull requests to 'production' or 'main' branches
#   - Manually via workflow_dispatch
#
# Deployment:
#   ⚠️ This workflow does NOT deploy to production
#   Actual deployment uses webhook-based system (see guideline/DEPLOYMENT_GUIDE.md)
#   Flow: Push to production → GitHub webhook → Server executes deploy.sh
#
# To disable: Delete or rename this file

name: Pull Request Validation

on:
  pull_request:
    branches:
      - production
      - main
  workflow_dispatch: # Allows manual trigger

env:
  DOCKER_IMAGE_NAME: stt-notes-backend

jobs:
  # Build and test
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run linter
        run: npm run lint

      - name: Build application
        run: npm run build

      - name: Run tests
        run: npm test
        continue-on-error: true

  # Build Docker image (validation only)
  docker-build:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (with caching)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      - name: Test Docker image
        run: |
          docker images
          echo "✅ Docker image built successfully!"
          echo "🎯 This validates the Dockerfile works correctly"
